version: 2

# One weekly PR for every ecosystem, so updates land as one change to review.
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all
    patterns: ['*']
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: all
    patterns: ['*']
