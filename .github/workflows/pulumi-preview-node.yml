name: Pulumi Preview (Node)

# Reusable workflow: `pulumi preview` for a Node-based Pulumi program,
# authenticating to AWS via OIDC (no static access keys). Posts the
# preview diff as a PR comment by default.
#
# Caller setup:
#   Environment variables (the job targets the `stack-name` environment, so
#   environment-scoped *variables* resolve here):
#     AWS_DEPLOY_ROLE_ARN  — IAM role the workflow assumes (OIDC trust policy
#                            must allow this repo's GitHub OIDC subject).
#     PULUMI_BACKEND_URL   — e.g. s3://my-pulumi-state-bucket
#                            (or pass `pulumi-backend-url` directly).
#   Secret — pass it EXPLICITLY, never via `secrets: inherit`:
#     PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
#       `secrets: inherit` does NOT forward secrets across repo owners (this
#       workflow lives under Yokai-Lab; callers under McNouvion are cross-owner),
#       so the only secret that reaches here is one explicitly mapped above.
#       The source must be a repo/org-level secret — the caller job that invokes
#       a reusable workflow can't target an environment, so an environment-scoped
#       secret resolves empty there. (Env-scoped *variables* are fine.)
#   Nothing for the gate: a run an admin of the calling repo triggered needs no
#     approval. Any other run fails at the gate until an admin triggers a new
#     run on the same commit: a re-run, or a label added to the PR when the
#     caller listens for `labeled`. `trusted-actors` adds people who aren't
#     admins.
#
# Pin callers to a major tag, e.g. @v1.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      stack-name:
        type: string
        default: beta
      work-dir:
        type: string
        default: infra/pulumi
      install-dir:
        type: string
        default: ''
        description: >-
          Directory to run `npm ci` in (where the lockfile lives). For an
          npm-workspaces monorepo this is the repo root ('.') while work-dir
          stays the Pulumi program. Defaults to work-dir for back-compat.
      aws-region:
        type: string
        default: us-east-2
      pulumi-backend-url:
        type: string
        required: false
        default: ''
        description: Pulumi state backend URL. Falls back to vars.PULUMI_BACKEND_URL.
      comment-on-pr:
        type: boolean
        default: true
        description: Post the preview diff as a PR comment. Set false when used as a deploy gate.
      extra-env:
        type: string
        default: ''
        description: Extra env vars as KEY=VALUE lines (one per line), exported for the Pulumi step.
      trusted-actors:
        type: string
        default: ''
        description: >-
          GitHub logins trusted besides the calling repo's admins, whose runs
          start the preview without approval. Separated by spaces, commas or
          newlines.
    secrets:
      PULUMI_CONFIG_PASSPHRASE:
        required: false
        description: >-
          Passphrase for the Pulumi passphrase secrets provider. Pass it
          EXPLICITLY (`secrets: { PULUMI_CONFIG_PASSPHRASE: ... }`); `secrets:
          inherit` does not forward secrets across repo owners. The source must
          be a repo/org-level secret so the caller's (non-environment) job can
          resolve it.

jobs:
  # The preview runs the checked-out Pulumi program with the AWS role, so
  # whoever wrote that code holds the role. Only a run a repo admin caused may
  # start it: an admin could edit the caller's workflow anyway, and GitHub
  # reports every bot, Dependabot and GitHub Apps included, as holding no
  # permission. Branch names and PR authors prove nothing: a worker can push
  # under any branch name, and a person's PR can carry a bot's later commit.
  # The check is on who triggered this event rather than on a label being
  # present, so an approval covers the commit it was given on and no later one.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check who triggered the run
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          TRUSTED: ${{ inputs.trusted-actors }}
        run: |
          set -f # a login such as dependabot[bot] is not a glob
          for login in ${TRUSTED//,/ }; do
            if [ "${login,,}" = "${ACTOR,,}" ]; then exit 0; fi
          done
          # Any failure to read the permission counts as none.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission) || permission=none
          if [ "$permission" = admin ]; then exit 0; fi
          echo "::error title=Preview needs approval::$ACTOR is neither an admin of this repo nor in trusted-actors, so the preview would hand the AWS role to code no admin vetted. An admin approves this commit by re-running this run, or by adding a label to the PR when the caller listens for labeled."
          exit 1

  preview:
    needs: gate
    environment: ${{ inputs.stack-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.install-dir || inputs.work-dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ inputs.install-dir || inputs.work-dir }}

      - name: Export extra env
        if: inputs.extra-env != ''
        run: echo "${{ inputs.extra-env }}" >> "$GITHUB_ENV"

      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: ${{ inputs.stack-name }}
          work-dir: ${{ inputs.work-dir }}
          comment-on-pr: ${{ inputs.comment-on-pr }}
        env:
          PULUMI_BACKEND_URL: ${{ inputs.pulumi-backend-url || vars.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
