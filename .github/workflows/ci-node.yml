name: Node CI

# Reusable CI workflow for a Node package/app. Runs format check, lint,
# dead-code check, build, and tests, plus a dependency audit on pull requests.
#
# Caller requirements:
#   * package.json scripts: `lint`, `knip`, `build`
#   * prettier + @yokailabs/prettier-config wired up (npx prettier --check .)
#   * vitest as the test runner
#
# Pin callers to a major tag, e.g. @v1.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      # Browsers for tests that run in one, such as vitest browser mode:
      # space-separated Playwright names (`chromium firefox`). Empty skips it.
      playwright-browsers:
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      # The repo's own playwright, so the browser builds match what its tests
      # expect; --with-deps adds the system libraries they need.
      - if: inputs.playwright-browsers != ''
        run: npx playwright install --with-deps ${{ inputs.playwright-browsers }}
      # Build before tests so integration tests can exercise the real dist/
      # (built index.html, asset paths, runtime config injection). A build
      # failure fails the job, so a separate build job would just be a rerun.
      - run: npm run build
      - run: npx vitest run

  # Checks the lockfile against the GitHub Advisory Database, which lists known
  # malware as high or critical, so a dependency a PR adds is vetted before it
  # merges. It audits the whole tree rather than the PR's diff, so on a push to
  # main it would turn main red the day an advisory lands against a dependency
  # already there. npm audit reads the lockfile, so nothing is installed.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm audit --audit-level=high
